name: Build & Release Desktop & VS Code Extension (Public velocity-apps Repo)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── 1. Desktop Applications Release Job (macOS, Windows, Linux) ────────────
  release-desktop:
    name: Build & Release Desktop App (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout public release repo
        uses: actions/checkout@v4

      - name: Checkout private source repository (Velocity)
        uses: actions/checkout@v4
        with:
          repository: 'Saksham-Goel1107/Velocity'
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: 'source-repo'

      - name: Setup Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm v11
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Node dependencies in source repository
        run: |
          cd source-repo/TurboRepo
          pnpm install --no-frozen-lockfile

      - name: Generate Platform App Icons
        run: |
          cd source-repo/TurboRepo/apps/user-app
          pnpm exec tauri icon src-tauri/icons/icon.png

      - name: Build Tauri App from source-repo
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Velocity Desktop & VS Code Extension ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 Velocity Cloud Workspaces & Applications (${{ github.ref_name }})

            Welcome to the official production release of **Velocity Desktop** and the **Velocity VS Code Extension**.

            ---

            ### 🖥️ **1. Velocity Desktop Application**
            High-performance native client for macOS, Windows, and Linux to spin up and manage cloud development sandboxes & GPU containers.

            - 🤖 **Android**: Download `Velocity_Android_${{ github.ref_name }}.apk`
            - 🍏 **macOS (Apple Silicon)**: Download `Velocity_Desktop_*_aarch64.dmg`
            - 🍏 **macOS (Intel)**: Download `Velocity_Desktop_*_x64.dmg`
            - 🪟 **Windows**: Download `Velocity_Desktop_*_x64-setup.exe` or `.msi`
            - 🐧 **Linux**: Download `Velocity_Desktop_*_amd64.AppImage` or `.deb`

            ---

            ### ⚡ **2. Velocity VS Code Extension (`.vsix`)**
            Seamlessly manage sandboxes, view real-time spend analytics, and connect to Velocity MCP servers right inside VS Code.

            - 🔌 **Extension Package**: Download `velocity-vscode-${{ github.ref_name }}.vsix`

            #### 📖 **Installation Instructions for VS Code Extension:**
            1. Download `velocity-vscode-${{ github.ref_name }}.vsix` below.
            2. Open VS Code.
            3. Press `Ctrl+Shift+X` (or `Cmd+Shift+X` on Mac) to open Extensions.
            4. Click the **`...`** (Views & More Actions) menu in the top right corner of the Extensions sidebar.
            5. Select **Install from VSIX...** and pick the downloaded `.vsix` file.
            6. Run `Velocity: Sign In / Set API Key` from the Command Palette (`Ctrl+Shift+P` / `Cmd+Shift+P`) to connect your account.
          releaseDraft: false
          prerelease: false
          projectPath: './source-repo/TurboRepo/apps/user-app'
          args: ${{ matrix.args }}

  # ── 2. Android APK Release Job (Tauri Android) ────────────────────────────
  release-android:
    name: Build & Release Android App (.apk)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout public release repo
        uses: actions/checkout@v4

      - name: Checkout private source repository (Velocity)
        uses: actions/checkout@v4
        with:
          repository: 'Saksham-Goel1107/Velocity'
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: 'source-repo'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"

      - name: Setup Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm v11
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Rust stable & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android'

      - name: Install Node dependencies in source repository
        run: |
          cd source-repo/TurboRepo
          pnpm install --no-frozen-lockfile

      - name: Initialize & Build Tauri Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          cd source-repo/TurboRepo/apps/user-app
          pnpm exec tauri icon src-tauri/icons/icon.png
          pnpm exec tauri android init
          
          # Replace default Tauri Android launcher icons with custom Velocity brand icons
          if [ -d "src-tauri/icons/android" ]; then
            echo "Copying custom Velocity brand icons into generated Android project..."
            mkdir -p src-tauri/gen/android/app/src/main/res
            cp -rf src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/
          fi
          
          pnpm exec tauri android build --apk

      - name: Setup Android Keystore & Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'velocity123' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'velocity-key' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'velocity123' }}
        run: |
          # Add Android build-tools (zipalign & apksigner) to PATH
          BUILD_TOOLS_PATH=$(find ${{ env.ANDROID_HOME }}/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          export PATH="$BUILD_TOOLS_PATH:$PATH"

          mkdir -p output-apk

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Using repository secret keystore..."
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > release.keystore
          else
            echo "Generating release signing keystore..."
            keytool -genkeypair -v -keystore release.keystore -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -dname "CN=Velocity, OU=Engineering, O=Velocity Cloud Inc, L=San Francisco, ST=CA, C=US"
          fi

          # Locate all built APK files
          APK_DIR="source-repo/TurboRepo/apps/user-app/src-tauri/gen/android/app/build/outputs/apk"
          UNIVERSAL_APK=$(find "$APK_DIR" -type f -name "*universal*.apk" | head -n 1)
          
          if [ -z "$UNIVERSAL_APK" ]; then
            echo "Universal APK not found, searching for any release APK..."
            UNIVERSAL_APK=$(find "$APK_DIR" -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$UNIVERSAL_APK" ]; then
            echo "ERROR: No built APK found in Gradle output!"
            exit 1
          fi

          echo "Primary APK for release: $UNIVERSAL_APK"

          # Sign all APKs produced
          for APK in $(find "$APK_DIR" -type f -name "*.apk"); do
            APK_NAME=$(basename "$APK" .apk)
            echo "Processing $APK ($APK_NAME)..."
            zipalign -f -p -v 4 "$APK" "output-apk/${APK_NAME}-aligned.apk" || cp "$APK" "output-apk/${APK_NAME}-aligned.apk"
            apksigner sign --ks release.keystore \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "output-apk/${APK_NAME}-signed.apk" \
              "output-apk/${APK_NAME}-aligned.apk"
            rm -f "output-apk/${APK_NAME}-aligned.apk"
          done

          # Align & Sign Primary Universal Release APK with standard name
          zipalign -f -p -v 4 "$UNIVERSAL_APK" output-apk/aligned_main.apk || cp "$UNIVERSAL_APK" output-apk/aligned_main.apk
          apksigner sign --ks release.keystore \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "output-apk/Velocity_Android_${{ github.ref_name }}.apk" \
            output-apk/aligned_main.apk
          rm -f output-apk/aligned_main.apk

          echo "========================================================"
          echo "         ANDROID SIGNING CERTIFICATE SHA-256 FINGERPRINT "
          echo "========================================================"
          apksigner verify --verbose --print-certs "output-apk/Velocity_Android_${{ github.ref_name }}.apk" || true
          echo "========================================================"

      - name: Upload Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: output-apk/*.apk
          tag_name: ${{ github.ref_name }}
          name: 'Velocity Desktop, Mobile & Extensions ${{ github.ref_name }}'
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}

  # ── 3. VS Code Extension Packaging & Release Job ───────────────────────────
  release-extension:
    name: Package & Release VS Code Extension (.vsix)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout public release repo
        uses: actions/checkout@v4

      - name: Checkout private source repository (Velocity)
        uses: actions/checkout@v4
        with:
          repository: 'Saksham-Goel1107/Velocity'
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: 'source-repo'

      - name: Setup Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm v11
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install Node dependencies in source repository
        run: |
          cd source-repo/TurboRepo
          pnpm install --no-frozen-lockfile

      - name: Package VS Code Extension (.vsix)
        run: |
          cd source-repo/TurboRepo/apps/vscode-extension
          pnpm run compile
          npx @vscode/vsce package --out ../../../../velocity-vscode-${{ github.ref_name }}.vsix

      - name: Upload .vsix to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: velocity-vscode-*.vsix
          tag_name: ${{ github.ref_name }}
          name: 'Velocity Apps & Extensions ${{ github.ref_name }}'
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
