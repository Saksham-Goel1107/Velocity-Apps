name: Build & Release Desktop & VS Code Extension (Public velocity-apps Repo)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ── 1. Desktop Applications Release Job (macOS, Windows, Linux) ────────────
  release-desktop:
    name: Build & Release Desktop App (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Verify Code Signing Secrets Presence
        shell: bash
        run: |
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is missing! Desktop releases MUST be cryptographically signed with Minisign."
            exit 1
          fi
          echo "Verified: Tauri minisign updater private key is present."

      - name: Checkout public release repo
        uses: actions/checkout@v7.0.1

      - name: Checkout private source repository (Velocity)
        uses: actions/checkout@v7.0.1
        with:
          repository: 'Saksham-Goel1107/Velocity'
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: 'source-repo'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js with pnpm store cache
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: 'source-repo/TurboRepo/pnpm-lock.yaml'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Cache Rust dependencies & build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'source-repo/TurboRepo/apps/user-app/src-tauri'
          cache-all-crates: true

      - name: Cache apt packages
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install Node dependencies in source repository
        run: |
          cd source-repo/TurboRepo
          pnpm install --no-frozen-lockfile

      - name: Generate Platform App Icons
        run: |
          cd source-repo/TurboRepo/apps/user-app
          pnpm exec tauri icon src-tauri/icons/icon.png

      - name: Setup Windows Code Signing Certificate
        if: matrix.platform == 'windows-latest'
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: powershell
        run: |
          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64.Trim())
            [IO.File]::WriteAllBytes("cert.pfx", $certBytes)
            $securePassword = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath "cert.pfx" -CertStoreLocation "Cert:\CurrentUser\My" -Password $securePassword
            Remove-Item "cert.pfx" -Force -ErrorAction SilentlyContinue
            echo "TAURI_WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Velocity, O=Velocity Cloud Inc, L=San Francisco, S=California, C=US" -CertStoreLocation "Cert:\CurrentUser\My" -KeyExportPolicy Exportable -KeySpec Signature -KeyLength 2048 -KeyAlgorithm RSA -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(5)
            echo "TAURI_WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build Tauri App from source-repo
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Velocity Desktop & VS Code Extension ${{ github.ref_name }}'
          releaseBody: |
            ## 🚀 Velocity Cloud Workspaces & Applications (${{ github.ref_name }})

            Welcome to the official production release of **Velocity Desktop** and the **Velocity VS Code Extension**.

            ---

            ### 🖥️ **1. Velocity Desktop Application**
            High-performance native client for macOS, Windows, and Linux to spin up and manage cloud development sandboxes & GPU containers.

            - 🤖 **Android**: Download `Velocity_Android_${{ github.ref_name }}.apk`
            - 🍏 **macOS (Apple Silicon)**: Download `Velocity_Desktop_*_aarch64.dmg`
            - 🍏 **macOS (Intel)**: Download `Velocity_Desktop_*_x64.dmg`
            - 🪟 **Windows**: Download `Velocity_Desktop_*_x64-setup.exe` or `.msi`
            - 🐧 **Linux**: Download `Velocity_Desktop_*_amd64.AppImage` or `.deb`

            ---

            ### ⚡ **2. Velocity VS Code Extension (`.vsix`)**
            Seamlessly manage sandboxes, view real-time spend analytics, and connect to Velocity MCP servers right inside VS Code.

            - 🔌 **Extension Package**: Download `velocity-vscode-${{ github.ref_name }}.vsix`

            #### 📖 **Installation Instructions for VS Code Extension:**
            1. Download `velocity-vscode-${{ github.ref_name }}.vsix` below.
            2. Open VS Code.
            3. Press `Ctrl+Shift+X` (or `Cmd+Shift+X` on Mac) to open Extensions.
            4. Click the **`...`** (Views & More Actions) menu in the top right corner of the Extensions sidebar.
            5. Select **Install from VSIX...** and pick the downloaded `.vsix` file.
            6. Run `Velocity: Sign In / Set API Key` from the Command Palette (`Ctrl+Shift+P` / `Cmd+Shift+P`) to connect your account.
          releaseDraft: false
          prerelease: false
          projectPath: './source-repo/TurboRepo/apps/user-app'
          args: ${{ matrix.args }}

      - name: Sign & Verify Windows Binaries (signtool)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1).FullName
          Get-ChildItem -Path "source-repo/TurboRepo/apps/user-app/src-tauri/target/release/bundle" -Recurse -Include *.exe,*.msi | ForEach-Object {
            & $signtool sign /sha1 $env:TAURI_WINDOWS_CERTIFICATE_THUMBPRINT /fd sha256 /tr http://timestamp.digicert.com /td sha256 /d "Velocity Desktop" /du "https://velocity.fairarena.app" $_.FullName
          }

      - name: Export & Upload Windows Public Root Certificate & Signed Binaries
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          $cert = Get-Item "Cert:\CurrentUser\My\$($env:TAURI_WINDOWS_CERTIFICATE_THUMBPRINT)"
          Export-Certificate -Cert $cert -FilePath "Velocity_Root_Certificate.cer" -Type CERT

      - name: Upload Signed Windows Binaries & Updater Signatures to GitHub Release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            source-repo/TurboRepo/apps/user-app/src-tauri/target/release/bundle/nsis/*.exe
            source-repo/TurboRepo/apps/user-app/src-tauri/target/release/bundle/nsis/*.exe.sig
            source-repo/TurboRepo/apps/user-app/src-tauri/target/release/bundle/msi/*.msi
            source-repo/TurboRepo/apps/user-app/src-tauri/target/release/bundle/msi/*.msi.sig
            Velocity_Root_Certificate.cer
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}

  # ── 2. Android APK Release Job (Tauri Android) ────────────────────────────
  release-android:
    name: Build & Release Android App (.apk)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify Android Signing Secrets Presence
        shell: bash
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS is missing! Android APK must be signed before distribution."
            exit 1
          fi
          echo "Verified: Android signing secrets are configured."

      - name: Checkout public release repo
        uses: actions/checkout@v7.0.1

      - name: Checkout private source repository (Velocity)
        uses: actions/checkout@v7.0.1
        with:
          repository: 'Saksham-Goel1107/Velocity'
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: 'source-repo'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
          key: android-ndk-26.1.10909125

      - name: Install Android NDK & Build Tools
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js with pnpm store cache
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: 'pnpm'
          cache-dependency-path: 'source-repo/TurboRepo/pnpm-lock.yaml'

      - name: Install Rust stable & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-linux-android,x86_64-linux-android'

      - name: Cache Rust dependencies & build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'source-repo/TurboRepo/apps/user-app/src-tauri'
          cache-all-crates: true

      - name: Install Node dependencies in source repository
        run: |
          cd source-repo/TurboRepo
          pnpm install --no-frozen-lockfile

      - name: Initialize & Build Tauri Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          cd source-repo/TurboRepo/apps/user-app
          pnpm exec tauri icon src-tauri/icons/icon.png
          pnpm exec tauri android init
          
          # Replace default Tauri Android launcher icons with custom Velocity brand icons
          if [ -d "src-tauri/icons/android" ]; then
            echo "Copying custom Velocity brand icons into generated Android project..."
            mkdir -p src-tauri/gen/android/app/src/main/res
            cp -rf src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/
          fi
          
          pnpm exec tauri android build --apk

      - name: Setup Android Keystore & Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Add Android build-tools (zipalign & apksigner) to PATH
          BUILD_TOOLS_PATH=$(find ${{ env.ANDROID_HOME }}/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          export PATH="$BUILD_TOOLS_PATH:$PATH"

          mkdir -p output-apk

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > release.keystore
          else
            keytool -genkeypair -v -keystore release.keystore -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$ANDROID_KEYSTORE_PASSWORD" -keypass "$ANDROID_KEY_PASSWORD" -dname "CN=Velocity, OU=Engineering, O=Velocity Cloud Inc, L=San Francisco, ST=CA, C=US"
          fi

          # Locate all built APK files
          APK_DIR="source-repo/TurboRepo/apps/user-app/src-tauri/gen/android/app/build/outputs/apk"
          UNIVERSAL_APK=$(find "$APK_DIR" -type f -name "*universal*.apk" | head -n 1)
          
          if [ -z "$UNIVERSAL_APK" ]; then
            UNIVERSAL_APK=$(find "$APK_DIR" -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$UNIVERSAL_APK" ]; then
            echo "ERROR: No built APK found in Gradle output!"
            exit 1
          fi

          # Align & Sign Primary Universal Release APK with standard name
          zipalign -f -p -v 4 "$UNIVERSAL_APK" output-apk/aligned_main.apk || cp "$UNIVERSAL_APK" output-apk/aligned_main.apk
          apksigner sign --ks release.keystore \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "output-apk/Velocity_Android_${{ github.ref_name }}.apk" \
            output-apk/aligned_main.apk
          rm -f output-apk/aligned_main.apk

          apksigner verify "output-apk/Velocity_Android_${{ github.ref_name }}.apk"

      - name: Upload Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: output-apk/*.apk
          tag_name: ${{ github.ref_name }}
          name: 'Velocity Desktop, Mobile & Extensions ${{ github.ref_name }}'
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}

  # ── 3. VS Code Extension Packaging & Release Job ───────────────────────────
  release-extension:
    name: Package & Release VS Code Extension (.vsix)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout public release repo
        uses: actions/checkout@v4

      - name: Checkout private source repository (Velocity)
        uses: actions/checkout@v4
        with:
          repository: 'Saksham-Goel1107/Velocity'
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: 'source-repo'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup Node.js with pnpm store cache
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'source-repo/TurboRepo/pnpm-lock.yaml'

      - name: Install Node dependencies in source repository
        run: |
          cd source-repo/TurboRepo
          pnpm install --no-frozen-lockfile --filter velocity-vscode...

      - name: Package VS Code Extension (.vsix)
        run: |
          cd source-repo/TurboRepo/apps/vscode-extension
          pnpm run compile
          npx @vscode/vsce package --out ../../../../velocity-vscode-${{ github.ref_name }}.vsix

      - name: Upload .vsix to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: velocity-vscode-*.vsix
          tag_name: ${{ github.ref_name }}
          name: 'Velocity Apps & Extensions ${{ github.ref_name }}'
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}

  # ── 4. Publish Tauri In-App Auto-Updater Manifest (latest.json) ───────────
  publish-updater-manifest:
    name: Publish Signed Auto-Updater Manifest (latest.json)
    needs: [release-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate and Upload latest.json for Tauri Updater
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');

            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tag
            });

            const assets = release.data.assets || [];
            console.log(`Found ${assets.length} assets for release ${tag}`);

            // Download helper
            async function getAssetContent(assetName) {
              const asset = assets.find(a => a.name === assetName);
              if (!asset) return null;
              const res = await github.rest.repos.getReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
                headers: { accept: 'application/octet-stream' }
              });
              return Buffer.from(res.data).toString('utf-8').trim();
            }

            const platforms = {};

            // 1. macOS aarch64
            const macArmApp = assets.find(a => (a.name.endsWith('.app.tar.gz') || a.name.endsWith('.dmg')) && a.name.includes('aarch64'));
            const macArmSig = assets.find(a => (a.name.endsWith('.app.tar.gz.sig') || a.name.endsWith('.dmg.sig')) && a.name.includes('aarch64'));
            if (macArmApp && macArmSig) {
              const signature = await getAssetContent(macArmSig.name);
              if (signature) {
                platforms['darwin-aarch64'] = {
                  signature: signature,
                  url: macArmApp.browser_download_url
                };
              }
            }

            // 2. macOS x86_64
            const macX64App = assets.find(a => (a.name.endsWith('.app.tar.gz') || a.name.endsWith('.dmg')) && (a.name.includes('x64') || a.name.includes('x86_64')));
            const macX64Sig = assets.find(a => (a.name.endsWith('.app.tar.gz.sig') || a.name.endsWith('.dmg.sig')) && (a.name.includes('x64') || a.name.includes('x86_64')));
            if (macX64App && macX64Sig) {
              const signature = await getAssetContent(macX64Sig.name);
              if (signature) {
                platforms['darwin-x86_64'] = {
                  signature: signature,
                  url: macX64App.browser_download_url
                };
              }
            }

            // 3. Windows x86_64 (nsis / setup.exe / zip)
            const winApp = assets.find(a => (a.name.endsWith('.nsis.zip') || a.name.endsWith('.exe')) && !a.name.endsWith('.sig'));
            const winSig = assets.find(a => (a.name.endsWith('.nsis.zip.sig') || a.name.endsWith('.exe.sig') || a.name.endsWith('.msi.sig')));
            if (winApp && winSig) {
              const signature = await getAssetContent(winSig.name);
              if (signature) {
                platforms['windows-x86_64'] = {
                  signature: signature,
                  url: winApp.browser_download_url
                };
              }
            }

            // 4. Linux x86_64 (AppImage)
            const linuxApp = assets.find(a => a.name.endsWith('.AppImage.tar.gz') || a.name.endsWith('.AppImage'));
            const linuxSig = assets.find(a => a.name.endsWith('.AppImage.tar.gz.sig') || a.name.endsWith('.AppImage.sig'));
            if (linuxApp && linuxSig) {
              const signature = await getAssetContent(linuxSig.name);
              if (signature) {
                platforms['linux-x86_64'] = {
                  signature: signature,
                  url: linuxApp.browser_download_url
                };
              }
            }

            const manifest = {
              version: version,
              notes: `Release ${tag} - Velocity Cloud Workspaces & Applications`,
              pub_date: new Date().toISOString(),
              platforms: platforms
            };

            const fs = require('fs');
            fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
            console.log('Generated updater manifest latest.json:\n', JSON.stringify(manifest, null, 2));

      - name: Upload latest.json updater manifest to Release
        uses: softprops/action-gh-release@v2
        with:
          files: latest.json
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
